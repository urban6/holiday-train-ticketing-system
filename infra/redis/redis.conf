# Redis 설정 — 명절 예매 시스템 로컬 실험 환경
#
# 용도: 대기열(Sorted Set 기반 유입 제어) + 분산 락(좌석 선점)
# 두 용도의 요구가 다를 때는 더 엄격한 쪽(대기열)에 맞춘다.

# --- 네트워크 ---
# 컨테이너 네트워크 내부에서만 접근하는 로컬 실험 환경 전제.
# 외부에 노출되는 환경에서는 절대 이 설정을 그대로 쓰지 말 것.
bind 0.0.0.0
protected-mode no
port 6379

# --- 메모리 ---
# 컨테이너 mem_limit(docker-compose.yml 기준 1G)보다 낮게 잡는다.
# Redis가 자기 한도에 먼저 걸려야 컨테이너 OOM Kill 대신
# 애플리케이션이 관측할 수 있는 에러로 드러난다.
#
# 실측 기준 대기열 항목 하나가 약 115바이트라 512mb면 대략 440만 건이 한계다.
#
# mem_limit 1G와의 여유가 4배에서 2배로 줄었다. 영속성을 끈 지금은 fork·COW가 없어 안전하지만,
# AOF/RDB 비용을 재려고 영속성을 다시 켜면 COW가 RSS를 컨테이너 한도까지 밀 수 있다.
# 그러면 위에서 지키려던 "Redis가 자기 한도에 먼저 걸린다"가 깨져 컨테이너 OOM Kill이 된다 —
# 그 실험을 할 땐 mem_limit도 함께 올린다.
maxmemory 1gb

# 대기열 데이터는 evict되면 안 된다.
# allkeys-lru였다면 대기 순번이 조용히 사라져 대기열 자체가 망가진다.
# noeviction은 메모리가 차면 쓰기를 거부하는데, 그 실패는 눈에 보이므로
# 오히려 다뤄볼 가치가 있는 시나리오다.
maxmemory-policy noeviction

# --- 영속성 ---
# 끈다. 대기열은 입장 통제 수단이고 실제 기록(예약)은 Postgres에 있다 —
# Redis가 잃는 건 데이터가 아니라 줄 서기 공정성이다. 분산 락도 마찬가지로 휘발성이다.
#
# appendfsync everysec으로도 크래시 시 최대 1초분(34k rps면 약 3만 4천 명)이 사라져
# "아무도 자리를 잃지 않는다"가 성립하지 않는다. 부분 복구는 전체 손실보다 다루기 어렵고,
# 시스템은 이미 대기열 소실을 Expired → 랜딩 리다이렉트로 처리한다.
#
# RDB에는 on/off 스위치가 없다. save를 비워 두는 것이 곧 끄는 것이고, 비우지 않으면
# 컴파일 기본값(3600 1 / 300 100 / 60 10000)이 살아남아 AOF와 별개로 계속 fork한다.
#
# 영속성 비용 자체를 재려면 이 두 값을 바꿔 켠다 —
# "영속성 없는 기준선 대비 AOF만 / RDB만이 각각 얼마인가"가 그 실험의 형태다.
save ""
appendonly no

# --- 로깅 ---
loglevel notice

# --- 미설정 (필요해지면 켠다) ---
# notify-keyspace-events Ex
#   대기열 항목의 TTL 만료를 이벤트로 받아야 할 때 활성화.
#   지금은 만료 감지 로직이 없어 켜두면 불필요한 부하만 생긴다.
