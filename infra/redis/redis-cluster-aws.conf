# Redis 설정 — AWS 측정용 Redis Cluster(마스터 3 + 레플리카 3)
#
# infra/redis/redis-cluster.conf(로컬 6프로세스용)와 메모리 정책·영속성·로깅은 같다.
# 다른 점은 노드 하나가 인스턴스 하나를 통째로 쓴다는 전제에서 온다.
#
# 로컬은 한 대에 6프로세스라 포트로 노드를 구분했지만, 여기서는 노드마다 호스트가 달라
# 전부 6379를 쓴다. cluster-config-file도 프로세스마다 다르게 줄 필요가 없다.
#
# 배치는 provision.sh의 redis 역할이 부팅 시점에 한다(맨 아래 cluster-announce-ip 포함).
bind 0.0.0.0

# 인증도 protected-mode도 없다. 보안 그룹이 유일한 방어선이라는 뜻이고, 6379와 16379를
# 자기 참조 규칙으로만 열어야 하는 이유다(infra/aws/README.md "보안 그룹" 절).
protected-mode no
port 6379

# --- 클러스터 ---
cluster-enabled yes
cluster-config-file /var/lib/redis/nodes.conf

# 로컬(redis-cluster.conf)은 failover를 눈으로 보려고 2000으로 낮춰 뒀지만, 여기서는
# 기본값 15000을 쓴다. 포화 지점에서 마스터가 Lua 실행으로 2초 넘게 막히면 멀쩡한 노드가
# 실패로 찍히고, cluster-require-full-coverage(기본 yes) 때문에 클러스터 전체가 쓰기를
# 거부한다 — 측정 런을 통째로 버리게 되는 실패 모드다. failover 자체를 재는 런에서만
# 낮춘다(docs/redis-cluster-bootstrap.md의 같은 경고 참고).
cluster-node-timeout 15000

# --- 메모리 ---
# 로컬 1gb가 아니라 3gb다. 워밍업 인원이 본 측정 전에 통째로 올라가 있는 구간이 있고,
# 대당 워밍업량을 유지하려고 WAS 대수에 비례해 늘리면 8대에서 480만 건이 된다.
# 7월 8대 측정에서 1gb를 넘겨(약 1.32GB) 올린 값이 그대로다.
maxmemory 3gb

# 대기열 데이터는 evict되면 안 된다.
# allkeys-lru였다면 대기 순번이 조용히 사라져 대기열 자체가 망가진다.
# noeviction은 메모리가 차면 쓰기를 거부하는데, 그 실패는 눈에 보이므로
# 오히려 다뤄볼 가치가 있는 시나리오다. 측정 도중에 만나면 그 런은 버린다.
maxmemory-policy noeviction

# --- 영속성 ---
# 끈다. 대기열은 입장 통제 수단이고 실제 기록(예약)은 Postgres에 있다 —
# Redis가 잃는 건 데이터가 아니라 줄 서기 공정성이다.
#
# RDB에는 on/off 스위치가 없다. save를 비워 두는 것이 곧 끄는 것이고, 비우지 않으면
# 컴파일 기본값이 살아남아 AOF와 별개로 계속 fork한다.
save ""
appendonly no

# --- 로깅 ---
loglevel notice
