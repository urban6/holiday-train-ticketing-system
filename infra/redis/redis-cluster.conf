# Redis 설정 — 로컬 Redis Cluster 실험 환경(마스터 3 + 레플리카 3)
#
# infra/redis/redis.conf(단일 Docker 인스턴스용)와 메모리·영속성·로깅 설정은 같다.
# 다른 점은 클러스터 모드 활성화뿐이다. 부트스트랩 절차는 docs/redis-cluster-bootstrap.md.
#
# Homebrew 네이티브로 6개 프로세스를 띄우는 용도라 port·bind·cluster-config-file은
# 프로세스마다 커맨드라인에서 넘긴다(예: --port 6380 --bind 127.0.0.1
# --cluster-config-file infra/redis/nodes-6380.conf) — 여기 적힌 값은 그중 하나를
# 빠뜨렸을 때의 안전한 기본값일 뿐이다.
bind 127.0.0.1
protected-mode no
port 6379

# --- 클러스터 ---
cluster-enabled yes

# 마스터가 죽었다고 판단하기까지 기다리는 시간. 기본값 15000ms면 로컬에서 failover를
# 눈으로 확인하는 데만 15초 넘게 걸려 시연에 부적합하다 — 의도적으로 낮춘 값이다.
# 운영값이 아니라 로컬 학습 환경 전제.
cluster-node-timeout 2000

# --- 메모리 ---
# 컨테이너가 아니라 네이티브 프로세스라 mem_limit 같은 외부 상한이 없다. 노드 하나가
# 감당할 대기열 항목 수를 이 값 하나로 직접 정한다 — 실측 기준 항목 하나가 약 115바이트라
# 512mb면 대략 440만 건이 한계다. 6개 프로세스가 각자 이 상한을 쓰므로 합은 최대 6배다.
maxmemory 1gb

# 대기열 데이터는 evict되면 안 된다.
# allkeys-lru였다면 대기 순번이 조용히 사라져 대기열 자체가 망가진다.
# noeviction은 메모리가 차면 쓰기를 거부하는데, 그 실패는 눈에 보이므로
# 오히려 다뤄볼 가치가 있는 시나리오다.
maxmemory-policy noeviction

# --- 영속성 ---
# 끈다. 대기열은 입장 통제 수단이고 실제 기록(예약)은 Postgres에 있다 —
# Redis가 잃는 건 데이터가 아니라 줄 서기 공정성이다.
#
# RDB에는 on/off 스위치가 없다. save를 비워 두는 것이 곧 끄는 것이고, 비우지 않으면
# 컴파일 기본값이 살아남아 AOF와 별개로 계속 fork한다.
save ""
appendonly no

# --- 로깅 ---
loglevel notice
