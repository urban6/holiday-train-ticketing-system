spring:
  threads:
    virtual:
      enabled: true
  application:
    name: waiting

  # 환경마다 바뀌는 값은 환경 변수로 덮는다. 기본값은 로컬(infra/docker-compose.yml) 기준이다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

      # Lettuce 기본값 60초면 Redis 포화 시 요청이 에러 없이 매달려 연결이 고갈된다.
      # 포화 상태에서도 가장 무거운 promote.lua가 6ms 남짓이라 1초면 정상 요청은 죽지 않는다.
      timeout: 1s

      # 패킷이 블랙홀되면 Lettuce 기본 10초가 그대로 사용자 대기 시간이 된다.
      connect-timeout: 1s

  datasource:
    # 5433인 이유는 infra/docker-compose.yml의 포트 주석 참고.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    hikari:
      # 가상 스레드는 늘어나도 풀은 늘지 않는다. 활성 정원(queue.capacity)이 이미 동시성 상한이다.
      maximum-pool-size: 10

server:
  tomcat:
    # 기본값 200이면 동시 연결이 수천 개일 때 Processor를 매번 새로 할당하고 버려 CPU가 먼저 마른다.
    # AWS WAS 8대 실측에서 200 → 20000으로 처리량 +35%, 지연 중앙값 627 → 14.3ms.
    # 8192는 max-connections 기본값에 맞춘 것이다.
    processor-cache: 8192

  servlet:
    session:
      # reservation-ttl이 항상 먼저 끝나므로 로그인을 끊는 값은 아니다.
      # 아무도 쓰지 않는 세션이 무한히 남지 않게 하는 용도다.
      timeout: 10m

      # 기본값(cookie,url)이면 로그인 직후 리다이렉트 URL에 jsessionid가 실린다.
      tracking-modes: cookie

      cookie:
        http-only: true
        # CSRF 토큰이 없어 SameSite로 대신한다. 완전한 대체는 아니다.
        same-site: lax

# 입장 제어. 기본값을 코드에 두지 않았으므로 이 블록이 없으면 기동에 실패한다.
queue:
  # 판매 영업시간(Asia/Seoul). 개시 포함, 마감 제외.
  # 운영 값은 07:00 ~ 13:00이다. 개발 중에는 아무 때나 확인할 수 있게 종일 열어 둔다.
  open: "00:00"
  close: "23:59:59"

  # 해시 태그 샤드 수. Cluster가 아니면 단일 Redis가 전부 받는다(키만 갈리고 처리량 이득은 없음).
  shard-count: 3

  # 동시에 로그인·예약할 수 있는 인원. 샤드가 나눠 가지므로 shard-count보다 작을 수 없다.
  capacity: 1000

  # 한 주기에 승격할 최대 인원. 정원이 통째로 빌 때 한 번에 올리면 그동안 Redis가 멈춘다.
  max-batch: 500

  promote-interval: 1s

  # 승격 후 입장 확정(claim)까지 주는 시간. 폴링을 멈춘 이탈자의 슬롯을 회수하는 장치다.
  # 입장이 가까운 사람은 폴링 하한(5초)에 있어서, 상한의 5배면 비활성 탭 지연까지 덮는다.
  admission-grace: 150s

  # 입장 확정 후 로그인까지 주는 시간. 로그인하면 만료가 reservation-ttl로 다시 찍힌다.
  session-ttl: 10m

  # 로그인 후 예약에 주는 시간. 이 값이 곧 정원의 회전 주기다.
  reservation-ttl: 3m

  # 폴링 주기 = clamp(하한, 순번 / 승격 속도 / poll-updates, 상한). 서버가 계산해 응답에 싣는다.
  # 상한 30초는 브라우저가 비활성 탭 타이머를 1분에 1회로 조이는 것에 맞춘 값이다.
  min-poll-interval: 5s
  max-poll-interval: 30s

  # 입장 전에 순번이 최소 몇 번 갱신되는가. 1이면 마지막 구간에서 화면이 멈춘 것처럼 보인다.
  poll-updates: 4

  # 알려 준 주기 + 이 값까지 조회가 없으면 이탈로 보고 회수한다. leave가 오지 않는
  # 크래시·기기 꺼짐·네트워크 단절을 덮는다. 지터, 백오프 한 번, 비활성 탭 지연을 합친 값이다.
  poll-grace: 60s

  # 회수 처리량은 샤드당 max-sweep ÷ 이 값이다. 대량 이탈에 밀리지 않게 주기를 짧게 둔다.
  # max-sweep을 키우는 것과 달리 스크립트 한 번의 실행 시간이 늘지 않는다.
  sweep-interval: 1s

  # 한 주기에 회수할 최대 인원. max-batch와 같은 이유.
  max-sweep: 500

  # 승격·회수 스케줄러를 이 인스턴스에서 돌릴지. WAS를 다중화하면 정확히 1대만 true여야 한다.
  # 여러 대가 돌면 실효 배치가 대수만큼 커진다.
  scheduler-enabled: ${QUEUE_SCHEDULER_ENABLED:true}

# 예약 설정. queue와 마찬가지로 이 블록이 없으면 기동에 실패한다.
reservation:
  max-per-member: 6

management:
  endpoints:
    web:
      exposure:
        # 인증이 없다. 외부에 노출되는 환경에서는 경로를 막거나 management.server.port로 분리한다.
        include: health,metrics
  endpoint:
    health:
      # 로컬 학습 환경 전제. 외부 노출 시 never 또는 when-authorized로 바꾼다.
      show-details: always

logging:
  level:
    com.urban6.waiting: debug
