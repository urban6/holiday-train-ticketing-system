# 부하 테스트 전용 프로파일.
# 측정을 왜곡하는 것만 끈다. 그 외에는 기본 프로파일과 같다.
#
#   java -jar server/build/libs/waiting-0.0.1.jar \
#        --spring.profiles.active=loadtest

logging:
  level:
    # info로 둔다. 터미널에서 java -jar로 띄울 때
    # "Started WaitingApplication" / "Tomcat started on port 8080"이 안 보이면
    # 앱이 준비됐는지 알 수 없다.
    root: info
    # 요청당 로그는 끈다. System.out의 내부 락이 Java 21 가상 스레드에서
    # pinning 지점이라, 켜두면 대기열이 아니라 로거를 측정하게 된다.
    # (현재 WaitingQueueService의 log.debug는 주석 처리돼 있지만,
    #  되살려도 부하 테스트가 오염되지 않도록 여기서 한 번 더 막는다.)
    com.urban6.waiting: warn

spring:
  data:
    redis:
      # timeout·connect-timeout은 운영에도 필요한 값이라 기본 프로파일에 있다.
      cluster:
        # Homebrew 네이티브 redis-server로 실제 클러스터 이득과 자동 failover를 잰다
        # (Docker는 포트 포워딩이 처리량의 상당 부분을 먹어 측정에 부적합 — redis-benchmark
        # 실측 기록 참고). 부트스트랩 절차는 docs/redis-cluster-bootstrap.md 참고.
        #
        # 6380~6382만 적는다. 이 셋은 레플리카를 붙이든(마스터 3 + 레플리카 3) 안 붙이든
        # (분배 확인용 마스터 3대) 항상 마스터라, 두 구성 어느 쪽에서도 그대로 맞는 시드다.
        # 하나로 줄이지는 않는다 — 기동 순간 그 하나가 아직 안 떠 있으면 초기 토폴로지 탐색이
        # 실패하는데, 셋이면 나머지 둘이 받아 준다. 레플리카는 여기 적지 않아도 클러스터가
        # 토폴로지로 알려 주므로 failover를 따라가는 데 지장이 없다.
        nodes:
          - 127.0.0.1:6380
          - 127.0.0.1:6381
          - 127.0.0.1:6382
      lettuce:
        cluster:
          refresh:
            # 장애 조치 뒤 클라이언트가 새 마스터를 알아채는 주기. 개별 명령의 MOVED 재시도는
            # 이 값과 무관하게 항상 따라가므로, 이 값은 "전체 토폴로지 지도가 얼마나 빨리
            # 새로 고쳐지는가"만 정한다 — 최악의 경우 failover 뒤 이 시간만큼은 지도가 낡은
            # 채로 매 명령이 한 번 튕겼다가 재시도로 성공한다.
            period: 5s

queue:
  # 마스터 3개에 맞춘 샤드 수. 위 cluster.nodes와 이 값이 어긋나면(예: 샤드 5인데 마스터가
  # 3개) 일부 샤드의 해시 태그가 몰려 균등 분배가 깨진다 — docs/redis-cluster-bootstrap.md의
  # keyslot 정렬 절차가 정확히 이 개수(3)를 전제로 한다.
  shard-count: 3

server:
  tomcat:
    # 기본 100. 100요청마다 커넥션이 끊기면 임시포트(16384개)와
    # TIME_WAIT(약 30초) 때문에 약 546 conn/s에서 막힌다.
    # 서버가 아니라 macOS TCP 스택을 측정하게 된다.
    max-keep-alive-requests: -1

    # 커널 accept 큐에 요청하는 크기. 기본 100.
    # 실효 백로그는 min(이 값, kern.ipc.somaxconn)이라 둘 다 올려야 의미가 있다.
    #   sudo sysctl -w kern.ipc.somaxconn=1024
    # 큐가 넘치면 커널이 연결을 그냥 버려서 클라이언트에는 connection reset으로 보인다.
    # VU 2000 동시 접속에서 간헐적 실패의 원인이었다.
    accept-count: 1000
