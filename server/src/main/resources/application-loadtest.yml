# 부하 테스트 전용 프로파일. 측정을 왜곡하는 것만 끈다.
#
#   java -jar server/build/libs/waiting-0.0.1.jar --spring.profiles.active=loadtest

logging:
  level:
    root: info
    # System.out 락이 가상 스레드 pinning 지점이라, 켜 두면 대기열이 아니라 로거를 측정한다.
    com.urban6.waiting: warn

spring:
  data:
    redis:
      cluster:
        # 로컬 Homebrew 네이티브 클러스터 기준(docs/redis-cluster-bootstrap.md).
        # AWS에서는 REDIS_CLUSTER_NODES로 덮는다. 개수는 shard-count와 맞춘다.
        nodes: ${REDIS_CLUSTER_NODES:127.0.0.1:6380,127.0.0.1:6381,127.0.0.1:6382}
      lettuce:
        cluster:
          refresh:
            # failover 뒤 토폴로지를 다시 읽는 주기. 그 전까지는 MOVED 재시도로 따라간다.
            period: 5s

queue:
  # 마스터 수와 맞춘다. 해시 태그의 keyslot 정렬이 이 개수를 전제로 한다.
  shard-count: 3

server:
  tomcat:
    # 기본 100이면 연결이 자주 끊겨 임시 포트와 TIME_WAIT 때문에 macOS TCP 스택을 측정하게 된다.
    max-keep-alive-requests: -1

    # 실효 백로그는 min(이 값, kern.ipc.somaxconn)이다. 둘 다 올려야 한다.
    #   sudo sysctl -w kern.ipc.somaxconn=1024
    accept-count: 1000
