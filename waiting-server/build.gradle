plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.urban6'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 톰캣 인메모리 세션을 Redis로 옮긴다. WAS를 다중화하면 인스턴스마다 세션이 따로 놀아
	// 로그인이 요청마다 풀리는데, 그때를 위한 선행 작업이다 (LoginSession.java 참고).
	// Boot 4는 세션 자동 구성도 기술별 모듈로 쪼갰다. spring-session-data-redis(저장소 구현체)만
	// 넣으면 라이브러리는 클래스패스에 있는데 자동 구성이 안 붙어 톰캣 인메모리 세션이 조용히
	// 그대로 쓰인다 — flyway-core 때와 같은 함정이다. spring-boot-session-data-redis 하나면
	// spring-boot-session·spring-session-data-redis·spring-boot-data-redis를 다 끌어온다.
	implementation 'org.springframework.boot:spring-boot-session-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 대기열 진입을 Kafka로 흘려 Redis 유입률에 상한을 거는 경로에 쓴다
	// (queue.enqueue-via-kafka). flyway·session과 같은 이유로 자동 구성 모듈 쪽 이름이다 —
	// spring-kafka만 넣으면 라이브러리는 클래스패스에 있는데 자동 구성이 붙지 않는다.
	implementation 'org.springframework.boot:spring-boot-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// BCrypt만 쓰려고 넣는다. spring-boot-starter-security와 달리 서블릿 필터 체인이
	// 딸려 오지 않아서, 대기열 API 경로에 요청당 비용이 한 톨도 늘지 않는다.
	// (spring-core에는 의존한다. 위 스타터들이 이미 가져오므로 추가할 것은 없다.)
	implementation 'org.springframework.security:spring-security-crypto'

	// Boot 4는 자동 구성을 기술별 모듈로 쪼갰다. flyway-core만 넣으면 라이브러리는 클래스패스에
	// 있는데 자동 구성이 붙지 않아, 마이그레이션이 조용히 실행되지 않는다.
	// 기동은 멀쩡히 성공하고 테이블만 없는 상태가 되므로 특히 알아채기 어렵다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	// Flyway 10부터 DB별 지원도 모듈로 갈라졌다. 이게 없으면 Postgres를 못 알아본다.
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// Flyway는 기동 시점에 마이그레이션을 돌리므로, DB가 없으면 컨텍스트 로드 테스트부터 깨진다.
	// (Redis는 커넥션이 지연 생성이라 지금까지는 Docker 없이도 테스트가 통과했다.)
	// 테스트가 자립하도록 테스트 전용 Postgres를 컨테이너로 띄운다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Testcontainers 2.x에서 아티팩트 이름이 바뀌었다(postgresql → testcontainers-postgresql).
	// 예전 이름을 쓰면 BOM에 없어서 버전을 못 찾는다는 형태로 실패한다.
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
