spring:
  threads:
    virtual:
      enabled: true
  application:
    name: waiting

  # 아래 네 값과 queue.scheduler-enabled(다섯째, WAS 다중화 시점에만 쓰는 배포 토폴로지 값)
  # 만 환경마다 바뀐다. 나머지 설정은 로컬과 AWS가 같다.
  # 기본값은 로컬(infra/docker-compose.yml) 기준이라 clone 직후 그냥 뜬다.
  # AWS에서 덮는 방법은 infra/aws/env.example 참고 — 비밀번호는 명령행 인자로 넘기지 않는다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # spring.session.data.redis.repository-type의 기본값(default)이 이미 원하는 값이라
  # 따로 적지 않는다 — INDEXED로 바꾸면 principal로 세션을 찾는 정렬 인덱스를 Redis에 추가로
  # 관리하는데, 이 앱엔 그 기능이 없어 대기열 Redis에 불필요한 백그라운드 부하만 얹는다.
  # 세션 키는 기본 네임스페이스(spring:session:*)를 그대로 쓴다 — 대기열 키(*:holiday:*)와
  # 접두사가 겹치지 않아 measure.sh의 초기화(reset_queue)가 세션까지 지우지 않는다.

  datasource:
    # 5432가 아니라 5433이다. 이유는 infra/docker-compose.yml의 포트 주석 참고.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketing}
    username: ${DB_USERNAME:ticketing}
    # 기본값을 남겨 둬도 위험하지 않다. RDS는 이 비밀번호를 받아 주지 않으므로
    # DB_PASSWORD를 빠뜨리면 기동이 실패한다 — 약한 비밀번호로 조용히 뜨는 경로가 없다.
    password: ${DB_PASSWORD:ticketing}
    hikari:
      # 가상 스레드는 얼마든지 늘어나지만 커넥션 풀은 안 늘어난다 — 풀 크기가 곧 DB 동시성 상한이다.
      # 로그인은 1인당 1회이고 활성 정원(queue.capacity)이 이미 상한이라 10이면 넉넉하다.
      # 여기서 병목이 보인다면 풀을 키우기 전에 왜 커넥션을 오래 쥐고 있는지부터 봐야 한다.
      maximum-pool-size: 10

server:
  tomcat:
    # 톰캣이 재사용하려고 쥐고 있는 Http11Processor의 개수. 기본값은 200이다.
    #
    # 연결이 유휴↔활성을 오갈 때마다 여기서 꺼내 쓰고 돌려놓는데, 동시에 열린 연결이 이 값을
    # 넘으면 대부분 새로 할당하고 버리게 된다. Processor 하나가 헤더 버퍼까지 물고 있어
    # 그 쓰레기가 그대로 GC 부담이 되고, 힙이 아니라 CPU가 먼저 마른다.
    #
    # 기본값 200으로는 동시 연결이 수천 개인 순간에 무너진다. 대당 동시 연결 6,259개로 잰
    # 실측(AWS, WAS 8대)에서 200 → 20000으로 올리자:
    #   처리량      67,902 → 91,745 req/s   (+35%)
    #   지연 중앙값    627 → 14.3 ms        (44배)
    #   요청당 할당     80 → 45 KB          (-44%)
    # 이 설정 하나만 바꾼 결과다. 근거는 README의 「측정 결과 — 측정하면서 찾아낸 문제」.
    #
    # 8192는 max-connections의 기본값과 맞춘 것이다 — 동시에 받는 연결만큼 있으면 되고
    # 그보다 크게 잡을 이유가 없다는 톰캣 쪽 지침을 따른다.
    #
    # 부하 측정용 값이 아니라 운영에도 그대로 필요한 값이라 loadtest 프로파일이 아니라 여기 둔다.
    processor-cache: 8192

  servlet:
    session:
      # 로그인 후에는 queue.reservation-ttl(3분)이 항상 먼저 끝나므로 이 값이 실제로
      # 로그인을 끊는 일은 없다. 여기서 하는 일은 "입장권도 세션도 남았는데 아무도 쓰지 않는"
      # 상태를 유한하게 만드는 것뿐이라, active 슬롯보다 넉넉하게 잡아 둔다.
      #
      # 입장권이 먼저 죽는 방향이 의도한 방향이다 — 정원 회수가 로그인 유지보다 우선이다.
      # 그리고 입장권이 죽어 랜딩으로 튕길 때 AdmissionGuard가 세션도 함께 무효화한다.
      timeout: 10m

      # 쿠키로만 세션을 추적한다. 기본값(cookie,url)이면 아직 쿠키를 안 돌려준 클라이언트에게
      # 톰캣이 URL에 ';jsessionid=...'를 붙여 준다. 로그인 직후 리다이렉트가 딱 그 경우라,
      # 세션 ID가 Location 헤더에 그대로 실려 브라우저 기록·Referer·접근 로그에 남는다.
      # 세션 ID는 곧 로그인 자격이므로 URL에 실려서는 안 된다.
      tracking-modes: cookie

      cookie:
        http-only: true
        # Spring Security를 쓰지 않아 CSRF 토큰이 없다. 크로스 사이트 POST에 세션 쿠키가
        # 실리지 않게 하는 것으로 대신한다. 토큰의 완전한 대체는 아니다 — README의 한계 항목.
        same-site: lax

# 입장 제어. 기본값을 코드에 두지 않았으므로 이 블록이 없으면 기동에 실패한다.
queue:
  # 판매 영업시간(Asia/Seoul). 이 시간 밖에서는 대기열 진입이 403 QUEUE_CLOSED로 거부되고
  # 승격도 멈춘다. 개시는 포함, 마감은 제외다.
  #
  # 실제 운영 값은 07:00 ~ 13:00이다. 다만 개발·테스트가 시간대에 묶이면 아무 때나 화면을
  # 확인할 수 없으므로 지금은 종일 열어 둔다. 운영 모드로 돌릴 땐 이 두 값만 바꾼다.
  # 진입 거부 문구도 이 값을 그대로 읽는다.
  open: "00:00"
  close: "23:59:59"

  # 동시에 로그인·예약할 수 있는 인원. 뒷단이 감당할 수 있는 수를 여기에 적는다.
  capacity: 1000

  # 한 주기에 승격할 최대 인원. Redis는 단일 스레드라 정원이 통째로 비는 순간
  # 만 명을 한 번에 올리면 그동안 다른 모든 요청이 멈춘다.
  max-batch: 500

  promote-interval: 1s

  # 승격 후 입장 확정(claim)까지 주는 시간. 이 안에 쓰지 않으면 슬롯이 회수된다.
  # 새로고침으로 이탈한 유령을 걸러내는 장치이기도 하다 — 유령은 폴링을 안 하니 claim도 못 한다.
  #
  # 승격을 알아채는 수단이 폴링뿐이라 주기 상한(max-poll-interval)의 5배로 잡았다. 5배면
  # 충분한 이유는, 입장이 가까운 사람은 상한이 아니라 하한(5초)에 있기 때문이다 —
  # 상한 30초를 받는 건 6만 번째 뒤쪽이고 그들에게는 아직 승격이 오지 않는다.
  # 남은 배수는 비활성 탭 타이머 지연이 가져간다.
  # 짧을수록 유령 회수는 빨라지고, 딴 탭에 있던 정상 사용자가 자리를 잃을 위험은 커진다.
  admission-grace: 150s

  # 입장 확정 후 로그인까지 주는 시간. 예약할 시간은 여기에 포함되지 않는다 —
  # 로그인에 성공하는 순간 만료가 reservation-ttl로 다시 찍히기 때문이다.
  session-ttl: 10m

  # 로그인 후 예약에 주는 시간. 이 시간이 지나면 활성 슬롯이 회수되고,
  # 다음 요청에서 AdmissionGuard가 랜딩으로 돌려보낸다.
  #
  # 이 값이 곧 정원(capacity)의 회전 주기다. 짧을수록 뒷사람의 대기가 줄고,
  # 길수록 예약 중에 시간이 끊길 위험이 준다.
  #
  # 설계값 3분. 만료를 눈으로 빨리 확인하려면 1분 등으로 낮춰도 된다.
  # 화면 문구도 이 값을 그대로 읽으므로, 바꿀 곳은 여기뿐이다.
  reservation-ttl: 3m

  # 대기 순번을 다시 물어보기까지의 최소·최대 간격. 주기는 서버가 정해 조회 응답에 실어 보낸다 —
  # 승격 속도와 정원은 서버만 알고 있어서, 클라이언트가 자기 순번으로 직접 계산하게 두면
  # 이 값을 바꿀 때마다 waiting.js와 k6 스크립트를 같이 고쳐야 한다.
  #
  # 주기 = clamp(하한, 순번 / 승격 속도 / poll-updates, 상한)이다.
  # 하한이 없으면 맨 앞이 서로를 두들기고, 상한이 없으면 뒤쪽이 사실상 폴링을 멈춘다.
  #
  # 상한 30초는 브라우저가 비활성 탭 타이머를 1분에 1회로 조이는 것에서 나온 값이다 —
  # 30초면 최악 공백이 60초라 아래 poll-grace가 그대로 덮지만, 60초로 올리면 공백이 120초가 되어
  # 유예도 두 배가 되고 유령 회수가 admission-grace(150초)에 근접한다.
  min-poll-interval: 5s
  max-poll-interval: 30s

  # 입장 전에 순번이 최소 몇 번 갱신되는가. 주기 = 남은 시간 ÷ 이 값이다.
  # 1로 두면 마지막 30초 동안 순번이 딱 한 번만 갱신돼 화면이 멈춘 것처럼 보인다.
  # 4로 올리는 대가는 총 조회 요청 +4%뿐이다 — 부하의 대부분은 상한에 붙은 뒤쪽 인원이 만든다.
  poll-updates: 4

  # 서버가 알려 준 주기에 이만큼을 더한 시각까지 조회가 오지 않으면 이탈로 보고 회수한다.
  # 닫기·탭 종료는 클라이언트가 leave를 보내지만, 크래시·기기 꺼짐·네트워크 단절에는
  # 브라우저 이벤트가 아예 오지 않는다. 그쪽을 덮는 유일한 수단이 이 값이다.
  #
  # 판정 기준이 고정값이 아니라 "알려 준 주기 + 이 값"이다. 상한 30초를 받은 뒤쪽 사람에게는
  # 90초가, 하한 5초를 받은 맨 앞 사람에게는 65초가 적용된다.
  #
  # 60초가 덮어야 하는 것 셋 —
  #   지터 +25%         최대 7.5초 (상한 30초 기준)
  #   백오프 한 사이클   최대 30초 (백오프는 서버가 준 주기보다 짧아지지 않는다 — waiting.js retryLater)
  #   비활성 탭 스로틀   나머지
  # 실패한 조회 한 번은 이 창 안에 들어오고 두 번은 들어오지 않는다. 낮추면 그 여유가 먼저 깎인다.
  poll-grace: 60s

  # 스위퍼가 도는 주기. 승격(promote-interval)만큼 자주 돌 이유가 없다.
  # 판정 기준에 걸린 poll-grace 자체가 수십 초 단위라, 그보다 촘촘하게 훑어도 결과가 같다.
  # poll-grace보다 크면 회수가 판정 기준보다 늦어져 기동에 실패한다.
  sweep-interval: 5s

  # 한 주기에 회수할 최대 인원. max-batch와 같은 이유다 — Redis는 단일 스레드라
  # 대량 이탈이 한꺼번에 몰리는 순간 상한이 없으면 그 시간이 그대로 다른 요청의 지연이 된다.
  max-sweep: 500

  # 이 인스턴스에서 승격·회수 스케줄러(AdmissionScheduler, StaleSweeper)를 돌릴지.
  # 튜닝값이 아니라 배포 토폴로지 값이라 QueueProperties(엄격 검증 레코드)에는 넣지 않는다.
  # WAS가 1대면 항상 true(기본값). WAS를 다중화하면 정확히 1대만 true여야 한다 — 인스턴스마다
  # 돌면 승격·회수 주기가 인스턴스 수만큼 짧아져 max-batch/max-sweep으로 막으려던 지연
  # 스파이크가 그대로 돌아온다. 리더 선출 대신 정적 플래그를 쓰는 이유는
  # infra/aws/README.md의 "2단계로 넘어가기 전에" 절 참고 — 측정 도중 리더가 바뀌는 변수를
  # 아예 들이지 않기 위해서다.
  scheduler-enabled: ${QUEUE_SCHEDULER_ENABLED:true}

# 예약 설정. queue와 마찬가지로 기본값을 코드에 두지 않아 이 블록이 없으면 기동에 실패한다.
reservation:
  # 한 사람이 걸 수 있는 최대 예약 건수. 입장 제어(queue)가 아니라 예약 도메인의 규칙이라
  # 여기 둔다. 화면의 "N/6" 표기도 이 값을 그대로 읽는다.
  max-per-member: 6

management:
  endpoints:
    web:
      exposure:
        # queue.* 지표(대기·활성 인원, 누적 승격·회수)를 상시로 읽는 유일한 경로다.
        # loadtest 프로파일은 로그를 warn으로 낮춰 승격·회수가 로그에 남지 않으므로,
        # 부하 측정 중에 큐 상태를 볼 수 있는 곳이 여기뿐이다. 그래서 프로파일에서 덮지 않는다.
        #
        # 인증이 없다. 로컬 학습 환경 전제이고, 외부에 노출되는 환경에서는 경로를 막거나
        # management.server.port로 포트를 분리해야 한다.
        include: health,metrics
  endpoint:
    health:
      # Redis 컴포넌트 상태를 응답에 펼쳐서 보여준다.
      # 로컬 학습 환경 전제. 외부에 노출되는 환경에서는 내부 정보가 새므로
      # never 또는 when-authorized로 바꿔야 한다.
      show-details: always

logging:
  level:
    com.urban6.waiting: debug
